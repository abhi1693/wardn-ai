name: wardn

x-runtime: &runtime
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-environment: &environment
  WARDN_DATABASE_URL: ${WARDN_DATABASE_URL:-postgresql+asyncpg://wardn:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/wardn}
  WARDN_API_TOKEN_SECRET: ${WARDN_API_TOKEN_SECRET:?Set WARDN_API_TOKEN_SECRET in .env}
  WARDN_SESSION_SECRET: ${WARDN_SESSION_SECRET:?Set WARDN_SESSION_SECRET in .env}
  WARDN_ENVIRONMENT: ${WARDN_ENVIRONMENT:-local}
  WARDN_MCP_RUNTIME_PROVIDER: ${WARDN_MCP_RUNTIME_PROVIDER:-local}
  WARDN_MCP_JOB_WORKER_ISOLATION: container
  WARDN_MCP_INSTALL_ROOT: /var/lib/wardn/mcp-installations
  WARDN_PUBLIC_BASE_URL: ${WARDN_PUBLIC_BASE_URL:-http://localhost:${WARDN_PORT:-3000}}
  WARDN_FRONTEND_BASE_URL: ${WARDN_PUBLIC_BASE_URL:-http://localhost:${WARDN_PORT:-3000}}
  WARDN_CORS_ORIGINS: ${WARDN_PUBLIC_BASE_URL:-http://localhost:${WARDN_PORT:-3000}}
  WARDN_SESSION_COOKIE_NAME: ${WARDN_SESSION_COOKIE_NAME:-wardn_session}
  WARDN_LOG_LEVEL: ${WARDN_LOG_LEVEL:-INFO}
  WARDN_TELEMETRY: ${WARDN_TELEMETRY:-true}
  HOME: /tmp
  XDG_CACHE_HOME: /tmp/.cache
  UV_CACHE_DIR: /tmp/uv-cache
  # Unset optional variables retain the application's defaults.
  WARDN_AUTH_MODE:
  WARDN_OIDC_PROVIDER_NAME:
  WARDN_OIDC_ISSUER_URL:
  WARDN_OIDC_CLIENT_ID:
  WARDN_OIDC_CLIENT_SECRET:
  WARDN_OIDC_REDIRECT_URI:
  WARDN_OIDC_SCOPES:
  WARDN_OIDC_ALLOWED_EMAIL_DOMAINS:
  WARDN_OIDC_SUPERUSER_EMAILS:
  WARDN_GITHUB_TOKEN:
  WARDN_MCP_TOOL_PROPOSAL_ENABLED:
  WARDN_MCP_TOOL_PROPOSAL_API_TOKEN:
  WARDN_OUTBOUND_HTTP_ALLOW_HTTP:
  WARDN_OUTBOUND_HTTP_ALLOWED_PORTS:
  WARDN_OUTBOUND_HTTP_PRIVATE_HOST_ALLOWLIST:
  WARDN_OPENBAO_AUTH_PROFILES_JSON:
  WARDN_CHAT_PROVIDER_WHATSAPP_BRIDGE_BASE_URL:

x-backend: &backend
  <<: *runtime
  # Local stdio MCP calls also run inside the API. The worker image supplies
  # node/npm and the installation directory in addition to the backend code.
  image: ${WARDN_WORKER_IMAGE:-ghcr.io/abhi1693/wardn-ai-worker:master}
  environment: *environment
  extra_hosts:
    - host.docker.internal:host-gateway
  networks: [default, data]
  volumes:
    - mcp-installations:/var/lib/wardn/mcp-installations

x-ready: &ready
  postgres:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_USER: wardn
      POSTGRES_DB: wardn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 uses a versioned PGDATA beneath this directory.
      - postgres-data:/var/lib/postgresql
    networks: [data]
    shm_size: 128mb
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    <<: *backend
    restart: "no"
    command: [alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --proxy-headers, --forwarded-allow-ips, "*"]
    depends_on: *ready
    healthcheck:
      <<: *healthcheck
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]

  worker:
    <<: *backend
    command: [python, -m, app.manage, runmcpjobs]
    depends_on: *ready
    stop_grace_period: 2m

  frontend:
    <<: *runtime
    image: ${WARDN_FRONTEND_IMAGE:-ghcr.io/abhi1693/wardn-ai-frontend:master}
    environment:
      HOSTNAME: 0.0.0.0
      WARDN_BACKEND_URL: http://api:8000
      NEXT_PUBLIC_SITE_URL: ${WARDN_PUBLIC_BASE_URL:-http://localhost:${WARDN_PORT:-3000}}
      WARDN_SESSION_COOKIE_NAME: ${WARDN_SESSION_COOKIE_NAME:-wardn_session}
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/wardn/frontend/.next/cache:size=128m,uid=1000,gid=1000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  proxy:
    <<: *runtime
    image: nginxinc/nginx-unprivileged:stable-alpine@sha256:442753882674b49ae2c1de83ed67896131c0777f56df5005e356e62bc3f7e7ce
    ports:
      - target: 8080
        published: ${WARDN_PORT:-3000}
        host_ip: ${WARDN_BIND_IP:-0.0.0.0}
        protocol: tcp
    volumes:
      - ./infra/compose/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/v1/health/ready]

networks:
  default:
  data:
    internal: true

volumes:
  postgres-data:
  mcp-installations:
