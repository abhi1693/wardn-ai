name: Container Image

on:
  push:
    branches:
      - master
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Semver image version without a leading v
        required: true

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend
    uses: abhi1693/actions/.github/workflows/docker-build-push.yml@master
    with:
      matrix: |
        [
          {"runner":"ubuntu-24.04","platform":"linux/amd64"},
          {"runner":"ubuntu-24.04-arm","platform":"linux/arm64"}
        ]
      image: ghcr.io/abhi1693/wardn-ai-backend
      context: wardn/backend
      file: wardn/backend/Dockerfile
      cache-scope: wardn-ai-backend
      build-args: |
        APP_VERSION=${{ github.event.release.tag_name || inputs.version || format('0.0.0+{0}', github.sha) }}
      tags: |
        type=raw,value=master,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        type=semver,pattern={{version}}
        type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
        type=raw,value=${{ github.sha }}
      labels: |
        org.opencontainers.image.source=https://github.com/abhi1693/wardn-ai
        org.opencontainers.image.title=wardn-ai-backend
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend
    uses: abhi1693/actions/.github/workflows/docker-build-push.yml@master
    with:
      matrix: |
        [
          {"runner":"ubuntu-24.04","platform":"linux/amd64"},
          {"runner":"ubuntu-24.04-arm","platform":"linux/arm64"}
        ]
      image: ghcr.io/abhi1693/wardn-ai-frontend
      context: .
      file: wardn/frontend/Dockerfile
      cache-scope: wardn-ai-frontend
      build-args: |
        APP_VERSION=${{ github.event.release.tag_name || inputs.version || format('0.0.0+{0}', github.sha) }}
      tags: |
        type=raw,value=master,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        type=semver,pattern={{version}}
        type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
        type=raw,value=${{ github.sha }}
      labels: |
        org.opencontainers.image.source=https://github.com/abhi1693/wardn-ai
        org.opencontainers.image.title=wardn-ai-frontend
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  worker:
    name: Worker
    uses: abhi1693/actions/.github/workflows/docker-build-push.yml@master
    with:
      matrix: |
        [
          {"runner":"ubuntu-24.04","platform":"linux/amd64"},
          {"runner":"ubuntu-24.04-arm","platform":"linux/arm64"}
        ]
      image: ghcr.io/abhi1693/wardn-ai-worker
      context: wardn/backend
      file: wardn/backend/Dockerfile
      target: worker
      cache-scope: wardn-ai-worker
      build-args: |
        APP_VERSION=${{ github.event.release.tag_name || inputs.version || format('0.0.0+{0}', github.sha) }}
      tags: |
        type=raw,value=master,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        type=semver,pattern={{version}}
        type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
        type=raw,value=${{ github.sha }}
      labels: |
        org.opencontainers.image.source=https://github.com/abhi1693/wardn-ai
        org.opencontainers.image.title=wardn-ai-worker
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  mcp-runtime:
    name: MCP runtime linux/arm64
    uses: abhi1693/actions/.github/workflows/docker-build-push.yml@master
    with:
      runs-on: ubuntu-24.04-arm
      image: ghcr.io/abhi1693/wardn-ai-mcp-runtime
      context: wardn/mcp-runtime
      file: wardn/mcp-runtime/Dockerfile
      platforms: linux/arm64
      cache-scope: wardn-ai-mcp-runtime-arm64
      tags: |
        type=semver,pattern={{version}}
        type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
        type=raw,value=${{ github.sha }}
      labels: |
        org.opencontainers.image.source=https://github.com/abhi1693/wardn-ai
        org.opencontainers.image.title=wardn-ai-mcp-runtime
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  whatsapp-bridge:
    name: WhatsApp bridge linux/arm64
    uses: abhi1693/actions/.github/workflows/docker-build-push.yml@master
    with:
      runs-on: ubuntu-24.04-arm
      image: ghcr.io/abhi1693/wardn-ai-whatsapp-bridge
      context: .
      file: wardn/whatsapp-bridge/Dockerfile
      platforms: linux/arm64
      cache-scope: wardn-ai-whatsapp-bridge-arm64
      tags: |
        type=semver,pattern={{version}}
        type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
        type=raw,value=${{ github.sha }}
      labels: |
        org.opencontainers.image.source=https://github.com/abhi1693/wardn-ai
        org.opencontainers.image.title=wardn-ai-whatsapp-bridge
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
